name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The canonical gate: everything `make check` runs. Self-contained (mock gtest
  # runner + fixture packs), so it runs on any GitHub-hosted ubuntu runner with
  # no CANN toolchain, simulator, or NPU. This is the merge gate.
  selfcheck:
    name: Self-check (gate + demo + tilelangGym)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run canonical self-check
        run: ./skill_foundry/cli/selfcheck.sh

  # Merge gate: product code must be ruff-clean. The bundled skill corpus is
  # excluded via [tool.ruff] extend-exclude in pyproject.toml.
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff==0.15.0"
      - run: ruff check .

  # Type check over the product code (skill_foundry/ + mcp/). Hard merge gate.
  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install mypy
      - run: mypy skill_foundry mcp

  # Packaging: `pip install -e .` (PEP 660) must work and the console script
  # must resolve. Catches pyproject.toml / setup.py regressions.
  package:
    name: Editable install + CLI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: skill-foundry version
      - run: skill-foundry skills --check
