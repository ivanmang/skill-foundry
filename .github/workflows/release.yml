name: Release

# Tag a release with `scripts/release.sh <version>` and push the tag; this
# builds the sdist + wheel and publishes them as a GitHub Release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build + GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --upgrade build
      - name: Build sdist + wheel
        run: python -m build
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
      # sanity: the wheel and console script actually import + run
      - name: Smoke the built wheel
        run: |
          pip install dist/*.whl
          skill-foundry version