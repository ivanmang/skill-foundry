# skill-foundry — PR merge gate (GitCode "Workflows" / AtomGit Action).
#
# Workflow files live in `.gitcode/workflows/*.yml` — NOT `.gitlab-ci.yml`
# (GitCode never reads that file; it has been removed).
#
# Runner: uses the AtomGit CLOUD-HOSTED pool via a three-part label
#   `[ <os>, <arch>, <flavor> ]`, e.g. `[ubuntu-latest, x64, small]`.
# No self-hosted runner is required.

name: skill-gate

on:
  pull_request:
    types: [ open, reopen, update ]
    branches: [ main ]
  workflow_dispatch:

jobs:
  skill-gate:
    name: skill-gate
    runs-on: [ ubuntu-latest, x64, small ]
    steps:
      - name: Checkout
        uses: checkout
      - name: skill spec + reference integrity
        run: python3 -m skill_foundry.lib.validate_skills --strict
      - name: catalog + skills index freshness
        run: python3 -m skill_foundry.cli.skills --check
      - name: unit tests
        run: python3 -m unittest discover -s tests