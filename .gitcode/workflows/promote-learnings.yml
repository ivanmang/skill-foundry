# Promote pending learnings into skills/known-failures.
#
# Surfaces `learnings/recent.md` pending entries as a proposed diff on a
# schedule (and on demand). This is a TEMPLATE: adjust runs-on / image to your
# team's gitcode runner, and add a branch-push + PR step to fully automate.
name: promote-learnings

on:
  workflow_dispatch:
  schedule:
    # daily 01:30 UTC — tune to your runner timezone
    - cron: '30 1 * * *'

jobs:
  JOB_promote:
    name: Promote learnings
    runs-on: [self-hosted]   # e.g. [self-hosted, arch=x64, spec=small]
    steps:
      - name: Checkout
        identifier: process_checkout
        uses: checkout
        with:
          token: ${{secrets.GIT_TOKEN}}
      - name: Propose pending learnings
        run: |
          echo "===== pending learnings (proposed diffs) ====="
          python3 skill_foundry/cli/promote.py --propose || true
          echo ""
          echo "To apply + open a PR:"
          echo "  python3 skill_foundry/cli/promote.py --apply --branch feat/learnings-$(date +%Y%m%d)"
          echo "  git push -u origin feat/learnings-$(date +%Y%m%d)"
