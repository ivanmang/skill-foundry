# Self-check on push / merge request: compile the scripts and run the demo smoke.
# TEMPLATE: adjust runs-on / image to your gitcode runner pool (self-hosted).
name: selfcheck

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ open, reopen, update ]
    branches: [ main ]

jobs:
  JOB_selfcheck:
    name: Self-check
    runs-on: [ ubuntu-latest, x64, small ]   # AtomGit cloud runner (2C/8G/50G)
    steps:
      - name: Checkout
        identifier: process_checkout
        uses: checkout
        with:
          token: ${{secrets.GIT_TOKEN}}
      - name: Self-check
        run: ./skill_foundry/cli/selfcheck.sh